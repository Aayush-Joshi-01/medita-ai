name: medita-ai

# Development compose file: bind-mounts source for live reload, exposes every
# service's port on localhost for direct debugging, and keeps stub app
# containers (real backend/frontend logic lands in build steps 2 and 6).
# `docker-compose.prod.yml` overrides this for a production-shaped run.

x-backend-env: &backend-env
  env_file:
    - .env

services:
  # ---------------------------------------------------------------------
  # Ingress
  # ---------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  # ---------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: dev
    <<: *backend-env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: dev
    <<: *backend-env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: dev
    <<: *backend-env
    command: ["python", "-m", "app.worker_stub"]
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medita}
      POSTGRES_DB: ${POSTGRES_DB:-medita}
      POSTGRES_FHIR_DB: ${POSTGRES_FHIR_DB:-medita_fhir}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medita}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medita12345}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medita}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medita12345}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-medita-media}
      MINIO_DOCS_BUCKET: ${MINIO_DOCS_BUCKET:-medita-docs}
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

  # ---------------------------------------------------------------------
  # AI gateway
  # ---------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    <<: *backend-env
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------
  # Interoperability
  # ---------------------------------------------------------------------
  hapi-fhir:
    image: hapiproject/hapi:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_FHIR_DB:-medita_fhir}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medita}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medita}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"

  # ---------------------------------------------------------------------
  # Dev tools (opt-in: docker compose --profile tools up)
  # ---------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["tools"]
    ports:
      - "1025:1025"
      - "8025:8025"

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    depends_on:
      - db
    ports:
      - "8081:8080"

  # ---------------------------------------------------------------------
  # Observability (opt-in: docker compose --profile observability up)
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

volumes:
  pgdata:
  redis_data:
  qdrant_storage:
  minio_data:
  prometheus_data:
  grafana_data:
  frontend_node_modules:
  frontend_next_cache:
